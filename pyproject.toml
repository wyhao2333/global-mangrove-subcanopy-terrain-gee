[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "global-mangrove-subcanopy-terrain-gee"
version = "0.1.0"
description = "GEE workflow for GEDI and AlphaEarth sampling in global mangroves."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
