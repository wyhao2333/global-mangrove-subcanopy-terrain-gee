gee:
  # 可以改成自己的 GEE / Google Cloud project，例如 ee-wyhao026。
  project: helpful-weft-484410-i4
  auth_mode: localhost
  # 两阶段流程用于保存 GEDI 脚印表资产的根目录；{project} 会自动替换为上面的 project。
  asset_root: projects/{project}/assets/global_mangrove_subcanopy_terrain

datasets:
  gedi_collection: LARSE/GEDI/GEDI02_A_002_MONTHLY
  alphaearth_collection: GOOGLE/SATELLITE_EMBEDDING/V1/ANNUAL
  # GMW v3 公共栅格与本项目的 GMW 2020 矢量来自同一版本，约 25 m。
  gmw_raster_collection: projects/earthengine-legacy/assets/projects/sat-io/open-datasets/GMW/extent/GMW_V3
  gmw_raster_image_index: gmw_v3_2020
  gedi_start_date: "2019-01-01"
  gedi_end_date: "2026-01-01"
  alphaearth_start_year: 2019
  alphaearth_end_year: 2025

paths:
  gmw_shp: data/raw/gmw_v3/gmw_v3_2020_vec.shp
  index_dir: data/index
  shard_dir: data/shards
  raw_samples_dir: outputs/raw_samples
  training_dir: outputs/training
  log_dir: logs

gmw:
  # 以下大小只影响旧式 legacy_shards 回退流程；推荐 native_tiles 流程不依赖它。
  # 单个 GeoJSON shard 太大会导致 GEE/代理断连，旧流程可从 2.0 降到 1.5 或 0.8。
  max_geojson_mb: 2.0
  read_batch_features: 500

sampling:
  # full 模式默认提交到 Google Drive，避免本地 getInfo 拉大表失败。
  export_mode: drive
  drive_folder: mangrove_gedi_alphaearth_samples
  tile_scale: 8
  local_row_limit: 5000
  max_new_tasks: 20
  skip_existing_tasks: true
  # 下面的 year_mode 只用于旧式直接联合采样；正式流程使用下方两阶段设置。
  # all = 一个 shard/瓦片导出全部年份；annual = 按年拆分作为失败回退。
  year_mode: all
  # 阶段1：一次保存全期GEDI脚印表资产，不重算AlphaEarth。
  staged_point_year_mode: all
  # 阶段2：从表资产按自适应空间块采样AlphaEarth。默认全期，但每块点数受限。
  staged_alpha_year_mode: all
  # 阶段2 GEDI 点表来源。默认使用已经批量共享的 2019-2025 GEDI 表资产目录。
  # 需要改为其他账号时，填写该账号已共享的完整 gedi_points 目录。
  gedi_source_asset_folder: projects/my-project-2025924/assets/global_mangrove_subcanopy_terrain/gedi_points
  # 步骤4b自动调度：首次提交30块；每10分钟检查一次；READY+RUNNING不超过10块时补交30块。
  alpha_initial_batch: 30
  alpha_refill_batch: 30
  alpha_poll_minutes: 10
  alpha_active_threshold: 10
  # 步骤4c把已经完成的AlphaEarth表资产导出到当前账号Google Drive的目录。
  alpha_drive_folder: mangrove_gedi_alphaearth_samples
  alpha_drive_max_new_tasks: 30
  # 新版步骤4c：直接把 AlphaEarth 表资产下载到 outputs/raw_samples。
  alpha_download_workers: 3
  alpha_download_retry_count: 3
  alpha_download_timeout_seconds: 900
  alpha_download_check_asset_count: true
  alpha_max_points_per_task: 10000
  alpha_min_chunk_degrees: 0.0625

aggregation:
  min_elev_count: 1
  preview_csv_rows: 10000

# 样本筛选试验：只生成候选 QC 标记、审计和内部对照，不覆盖原始 EGM2008 训练表。
sample_qc_experiment:
  input_training_parquet: data/mangrove_gedi_alphaearth_training_egm2008.parquet
  output_dir: outputs/analysis/sample_qc_experiment
  split_seed: 42
  train_fraction: 0.70
  h3_resolution: 8
  h3_min_samples: 5
  spatial_absolute_residual_m: 5.0
  spatial_robust_z_threshold: 6.0
  spatial_mad_floor_m: 0.5
  # 仅作敏感性对照，不是全球红树林的生物学绝对高程范围。
  range_min_m: -20.0
  range_max_m: 50.0
  repeat_iqr_thresholds_m: [1.0, 2.0, 5.0]
  repeat_reference_iqr_threshold_m: 2.0
  model_train_cap_per_region: 10000
  model_test_cap_per_region: 5000
  model_number_of_trees: 300
  model_mtry: 16
  model_bag_fraction: 0.632
  model_min_node_size: 5
  gedi_pilot_asset_root: projects/{project}/assets/global_mangrove_subcanopy_terrain/qc_pilot
  gedi_pilot_min_cell_samples: 50
  gedi_pilot_max_cell_samples: 5000
  gedi_pilot_max_regions: 14

# 步骤5b：GEDI 聚合标签由 WGS84 椭球高改正为 EGM2008 正高。
# 输入文件不会被修改；输出文件的 elev_median 为 EGM2008 正高，原值保留为 elev_median_wgs84。
vertical_datum:
  input_parquet: data/mangrove_gedi_alphaearth_training.parquet
  output_parquet: data/mangrove_gedi_alphaearth_training_egm2008.parquet
  egm2008_grid: F:/VDatum/us_nga_egm08_25.tif
  analysis_dir: outputs/analysis/egm2008_elevation_diagnostics
  batch_rows: 100000
  # 下列数值仅用于生成候选异常点审查表，不会删除任何训练样本。
  candidate_low_m: -20.0
  candidate_high_m: 50.0

# 推荐的 MEOW-14 分区建模流程。区域 Shapefile 不随公开仓库提交，
# 请从本项目“区域划分结果”文件夹复制到下列默认位置，或改为自己的绝对路径。
regional_modeling:
  region_shp: 区域划分结果/coastal_belt_irregular_mangrove_regions_shapefile/coastal_belt_irregular_mangrove_regions.shp
  region_code_field: REG_CODE
  region_name_field: REGION
  # 正式输入是步骤 5b 生成的 EGM2008 正高 Parquet；原始椭球高表不参与新一轮建模。
  input_training_parquet: data/mangrove_gedi_alphaearth_training_egm2008.parquet
  # 本次 [-20, 50] m 测试结果单独保存，避免与未筛选的 baseqa_v002 结果混用。
  output_dir: outputs/training/meow14_egm2008_range20_50_v003
  # 默认按闭区间 [-20, 50] m 筛除明显异常标签；这是标签完整性质控，不是生态绝对范围。
  elevation_qc_enabled: true
  elevation_min_m: -20.0
  elevation_max_m: 50.0
  # 步骤6a检测或安装后自动写入实际 Rscript.exe 路径。
  rscript_path: ""
  split_seed: 42
  train_fraction: 0.70
  # 每区：5 次独立 10% 无放回子样本，固定 24 组受 GEE 支持的参数。
  tuning_repeats: 5
  tuning_subsample_fraction: 0.10
  tuning_grid_trees: [100, 200, 300]
  tuning_grid_mtry: [8, 16]
  tuning_grid_bag_fraction: [0.5, 0.632]
  tuning_grid_min_node_size: [5, 10]
  assignment_grid_degrees: 0.1
  prediction_batch_rows: 100000
  save_local_models: false
  model_version: egm2008_range20_50_v003
  # 上传后的 14 个 TABLE Assets 应命名为 AFW_train70、AFE_train70 ... AME_train70。
  gee_training_asset_root: projects/{project}/assets/global_mangrove_subcanopy_terrain/training/meow14_{model_version}
  gee_model_asset_root: projects/{project}/assets/global_mangrove_subcanopy_terrain/models/meow14_{model_version}
  gee_max_concurrent_tasks: 3
  gee_poll_minutes: 10
